name = "tgcontact"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/webhook"]

[[d1_databases]]
binding = "DB"
database_name = "tgcontact"
# Leave database id unconfigured so CF "automatic resource provisioning" feature
# automatically creates and binds one the first time deploying this project.
# It's able to change the binded database later from Cloudflare Worker dashboard.
#database_id = "00000000-0000-0000-0000-000000000000"

[durable_objects]
bindings = [
  { name = "MEDIA_GROUP_DO", class_name = "MediaGroupDO" },
  { name = "SESSION_DO", class_name = "SessionDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MediaGroupDO", "SessionDO"]

[vars]
#TGC_NAME = "tgcontact"
#TGC_BOT_TOKEN = "" # tg bot token
#TGC_ADMIN_GROUP_ID = "0" # admin group id
#TGC_ADMIN_USER_IDS = "" # admin user ids, comma separated
#TGC_WELCOME_MESSAGE = "Hello! Thanks for contacting us. We will reach out as soon as possible."
#TGC_DELETE_TOPIC_AS_FOREVER_BAN = "0"
#TGC_DELETE_USER_MESSAGE_ON_CLEAR_CMD = "1"
#TGC_DISABLE_CAPTCHA = "0"
#TGC_MESSAGE_INTERVAL = "5" # interval between messages
#TGC_USERNAME = "" # admin username
#TGC_PASSWORD = "" # admin password
#TGC_SECRET = "" # jwt secret. fallbacks to password
#TGC_WEBHOOK_SECRET = "" # Telegram bot secret token. fallbacks to sha256(password)
